name: Build iPad 2 app (no jailbreak)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential fakeroot rsync perl git curl unzip zip libxml2 libtinfo5 libzip-dev

      - name: Install Theos (Linux iOS toolchain)
        run: |
          set -e
          export THEOS=$HOME/theos
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "theos installed:"; ls "$THEOS"

      - name: Fetch the iPhoneOS 10.3 SDK (last SDK with 32-bit armv7)
        run: |
          set -e
          export THEOS=$HOME/theos
          mkdir -p "$THEOS/sdks"
          if [ ! -d "$THEOS/sdks/iPhoneOS10.3.sdk" ]; then
            git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
            cd /tmp/sdks
            git sparse-checkout set --no-cone iPhoneOS10.3.sdk
            git checkout
            cp -R iPhoneOS10.3.sdk "$THEOS/sdks/"
          fi
          echo "SDKs present:"; ls "$THEOS/sdks"
          echo "liblaunch check:"; ls "$THEOS/sdks/iPhoneOS10.3.sdk/usr/lib/system/" | grep -i launch || echo "(no liblaunch in SDK)"

      - name: Build the app
        run: |
          set -e
          export THEOS=$HOME/theos
          make clean || true
          make

      - name: Package into an unsigned .ipa
        run: |
          set -e
          export THEOS=$HOME/theos
          APP=$(find . "$THEOS" -type d -name "HelloIPad2.app" 2>/dev/null | head -1)
          echo "App bundle: $APP"
          [ -n "$APP" ] || { echo "No .app produced"; exit 1; }
          rm -rf Payload HelloIPad2.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr HelloIPad2.ipa Payload
          echo "Built:"; ls -la HelloIPad2.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HelloIPad2-ipa
          path: HelloIPad2.ipa
